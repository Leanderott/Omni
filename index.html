<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni - Lernende KI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Omni / Blob -->
        <div id="blob" class="blob-container">
            <div class="eye">
                <div class="pupil"></div>
            </div>
            <div class="eye">
                <div class="pupil"></div>
            </div>
        </div>

        <!-- Status & Interaktion -->
        <div id="status-text">Klicke 'Aufwachen', um zu sprechen</div>
        <button id="talk-btn" class="btn">Aufwachen</button>

        <!-- Gedächtnis sichern / laden -->
        <div class="memory-controls">
            <button id="download-brain-btn" class="sub-btn">🧠 Wissen sichern</button>
            <button id="upload-brain-btn" class="sub-btn">📥 Wissen laden</button>
            <input type="file" id="brain-file-input" style="display: none;" accept=".json">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
