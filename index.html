<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Blob</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Der weiße KI-Fleck -->
        <div class="blob-container" id="blob">
            <div class="eye left-eye">
                <div class="pupil"></div>
            </div>
            <div class="eye right-eye">
                <div class="pupil"></div>
            </div>
        </div>

        <!-- Status & Button -->
        <p id="status-text">Ich höre zu...</p>
        <button id="talk-btn" class="btn">Sprechen</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
